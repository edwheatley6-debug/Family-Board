<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Family Board V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fff7ed,#e0f2fe);color:#111827}
.app{max-width:1100px;margin:auto;min-height:100vh;padding:18px;display:flex;flex-direction:column;gap:18px}
.screen{display:none}.screen.active{display:block}
.hero{background:linear-gradient(135deg,#fde68a,#f9a8d4,#bfdbfe);border-radius:30px;padding:22px;box-shadow:0 12px 28px #0002}
h1{font-size:44px;margin:0}.hero p{font-size:22px;font-weight:bold}
.stats,.grid,.scores{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat,.card,.scorebox{background:#fff;border-radius:26px;padding:18px;box-shadow:0 12px 28px #0002}
.label{font-size:24px;font-weight:900;margin:0}.value{font-size:46px;font-weight:900;margin:6px 0 0}
.tile{border:0;border-radius:28px;min-height:150px;padding:22px;text-align:left;font-weight:900;box-shadow:0 12px 28px #0002}
.tile .emoji{font-size:56px}.tile .title{display:block;font-size:38px}.tile .sub{font-size:18px;color:#374151}
.henry{background:#93c5fd}.arthur{background:#86efac}.calendar{background:#c4b5fd}.music{background:#f9a8d4}.points{background:#fde68a}.netflix{background:#fca5a5}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.pageTitle{font-size:42px;margin:0}
.btn,.mini{border:0;border-radius:16px;padding:14px 18px;background:#111827;color:#fff;font-size:20px;font-weight:900;margin:6px}.btn.secondary{background:#e5e7eb;color:#111827}.btn.danger{background:#b91c1c}
.list{display:flex;flex-direction:column;gap:12px;margin-top:16px}.item{display:flex;align-items:center;gap:16px;background:#f9fafb;border-radius:20px;padding:16px;font-size:30px;font-weight:bold}
input[type=checkbox]{width:34px;height:34px;transform:scale(1.2);accent-color:#2563eb}.done{text-decoration:line-through;color:#777}
.score{font-size:70px;font-weight:900;margin:0}.scoreName{font-size:34px;font-weight:900;margin:0}
textarea,input[type=text],input[type=password]{width:100%;font-size:22px;padding:14px;border-radius:16px;border:2px solid #ddd}textarea{min-height:190px}
.field{margin:16px 0}.field label{font-size:24px;font-weight:900;display:block;margin-bottom:8px}
.saved{display:none;background:#dcfce7;border-radius:18px;padding:14px;font-size:24px;font-weight:900;margin-top:14px}.saved.show{display:block}
.footer{text-align:center;color:#555;font-weight:bold}
@media(max-width:720px){.grid,.stats,.scores{grid-template-columns:1fr}.tile{min-height:120px}.tile .title{font-size:32px}.app{padding:12px}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen active">
<div class="hero"><h1>🌈 Family Board</h1><p>Tap a tile to get started</p><div class="stats"><div class="stat"><p class="label">👦 Henry Points</p><p class="value" id="hph">0 ⭐</p></div><div class="stat"><p class="label">👦 Arthur Points</p><p class="value" id="aph">0 ⭐</p></div></div></div>
<div class="grid">
<button class="tile henry" onclick="show('henry')"><span class="emoji">👦</span><span class="title">Henry Chores</span><span class="sub">Daily jobs</span></button>
<button class="tile arthur" onclick="show('arthur')"><span class="emoji">👦</span><span class="title">Arthur Chores</span><span class="sub">Daily jobs</span></button>
<button class="tile calendar" onclick="openLink(state.calendarLink)"><span class="emoji">📅</span><span class="title">Calendar</span><span class="sub">Open calendar</span></button>
<button class="tile music" onclick="openLink(state.musicLink)"><span class="emoji">🎵</span><span class="title">Music</span><span class="sub">Amazon Music</span></button>
<button class="tile points" onclick="show('points')"><span class="emoji">⭐</span><span class="title">Points</span><span class="sub">Pocket money</span></button>
<button class="tile netflix" onclick="openLink(state.netflixLink)"><span class="emoji">📺</span><span class="title">Netflix</span><span class="sub">Open Netflix</span></button>
</div>
<button class="btn secondary" onclick="openSettings()">⚙️ Settings</button>
</section>

<section id="henry" class="screen"><div class="card"><div class="row"><h1 class="pageTitle">👦 Henry Chores</h1><button class="btn" onclick="show('home')">Home</button></div><div class="list" id="henryList"></div><button class="btn secondary" onclick="resetChecks('henryChecks')">Reset Henry</button></div></section>
<section id="arthur" class="screen"><div class="card"><div class="row"><h1 class="pageTitle">👦 Arthur Chores</h1><button class="btn" onclick="show('home')">Home</button></div><div class="list" id="arthurList"></div><button class="btn secondary" onclick="resetChecks('arthurChecks')">Reset Arthur</button></div></section>

<section id="points" class="screen"><div class="card"><div class="row"><h1 class="pageTitle">⭐ Points</h1><button class="btn" onclick="show('home')">Home</button></div><div class="scores"><div class="scorebox"><p class="scoreName">Henry</p><p class="score" id="hp">0</p><button class="mini" onclick="changePoints('henry',1)">+1</button><button class="mini" onclick="changePoints('henry',-1)">-1</button><button class="mini" onclick="resetPoints('henry')">Reset</button></div><div class="scorebox"><p class="scoreName">Arthur</p><p class="score" id="ap">0</p><button class="mini" onclick="changePoints('arthur',1)">+1</button><button class="mini" onclick="changePoints('arthur',-1)">-1</button><button class="mini" onclick="resetPoints('arthur')">Reset</button></div></div><button class="btn secondary" onclick="resetAllPoints()">Reset All Points</button></div></section>

<section id="pin" class="screen"><div class="card"><div class="row"><h1 class="pageTitle">🔒 Settings</h1><button class="btn" onclick="show('home')">Home</button></div><div class="field"><label>Parent PIN</label><input id="pinInput" type="password" inputmode="numeric" placeholder="Default 1234"></div><button class="btn" onclick="unlockSettings()">Unlock</button></div></section>

<section id="settings" class="screen"><div class="card"><div class="row"><h1 class="pageTitle">⚙️ Settings</h1><button class="btn" onclick="show('home')">Home</button></div>
<div class="field"><label>Henry chores</label><textarea id="ht"></textarea></div>
<div class="field"><label>Arthur chores</label><textarea id="at"></textarea></div>
<button class="btn secondary" onclick="copyHenry()">Make Arthur same as Henry</button>
<div class="field"><label>Calendar link</label><input id="cl" type="text"></div>
<div class="field"><label>Music link</label><input id="ml" type="text"></div>
<div class="field"><label>Netflix link</label><input id="nl" type="text"></div>
<div class="field"><label>Settings PIN</label><input id="pinSet" type="password" inputmode="numeric"></div>
<button class="btn" onclick="saveSettings()">Save settings</button>
<button class="btn danger" onclick="factoryReset()">Reset whole board</button>
<div id="saved" class="saved">✅ Saved!</div>
</div></section>
<div class="footer">Progress is saved on this device.</div>
</div>

<script>
const defaults={
henryTasks:["Make bed / open blinds / turn off lights","Pyjamas away","Brush teeth","School items ready","Tidy","Clothes away","Brush teeth","Water bottle"],
arthurTasks:["Make bed / open blinds / turn off lights","Pyjamas away","Brush teeth","School items ready","Tidy","Clothes away","Brush teeth","Water bottle"],
henryChecks:{},arthurChecks:{},points:{henry:0,arthur:0},
calendarLink:"https://calendar.google.com",musicLink:"https://music.amazon.co.uk",netflixLink:"https://www.netflix.com",pin:"1234"
};
const KEY="family-board-v2-final";
let state=load();
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const s=localStorage.getItem(KEY);if(!s)return clone(defaults);const p=JSON.parse(s);return {...clone(defaults),...p,henryChecks:p.henryChecks||{},arthurChecks:p.arthurChecks||{},points:{...defaults.points,...(p.points||{})}}}catch(e){return clone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0)}
function renderList(id,tasks,key){const w=document.getElementById(id);w.innerHTML="";tasks.forEach((task,i)=>{const lab=document.createElement("label");lab.className="item";const box=document.createElement("input");box.type="checkbox";box.checked=!!state[key][i];const span=document.createElement("span");span.textContent=task;if(box.checked)span.classList.add("done");box.onchange=()=>{state[key][i]=box.checked;span.classList.toggle("done",box.checked);save()};lab.appendChild(box);lab.appendChild(span);w.appendChild(lab)})}
function renderPoints(){hp.textContent=state.points.henry;ap.textContent=state.points.arthur;hph.textContent=state.points.henry+" ⭐";aph.textContent=state.points.arthur+" ⭐"}
function renderSettings(){ht.value=state.henryTasks.join("\n");at.value=state.arthurTasks.join("\n");cl.value=state.calendarLink;ml.value=state.musicLink;nl.value=state.netflixLink;pinSet.value=state.pin}
function render(){renderList("henryList",state.henryTasks,"henryChecks");renderList("arthurList",state.arthurTasks,"arthurChecks");renderPoints();renderSettings()}
function resetChecks(k){state[k]={};save();render()}
function changePoints(n,v){state.points[n]=Math.max(0,state.points[n]+v);save();renderPoints()}
function resetPoints(n){state.points[n]=0;save();renderPoints()}
function resetAllPoints(){state.points.henry=0;state.points.arthur=0;save();renderPoints()}
function openSettings(){pinInput.value="";show("pin")}
function unlockSettings(){if(pinInput.value===state.pin){show("settings")}else alert("Incorrect PIN")}
function copyHenry(){at.value=ht.value}
function saveSettings(){const oldH=state.henryTasks.join("\n"),oldA=state.arthurTasks.join("\n");state.henryTasks=ht.value.split("\n").map(x=>x.trim()).filter(Boolean);state.arthurTasks=at.value.split("\n").map(x=>x.trim()).filter(Boolean);if(oldH!==state.henryTasks.join("\n"))state.henryChecks={};if(oldA!==state.arthurTasks.join("\n"))state.arthurChecks={};state.calendarLink=cl.value.trim()||defaults.calendarLink;state.musicLink=ml.value.trim()||defaults.musicLink;state.netflixLink=nl.value.trim()||defaults.netflixLink;state.pin=pinSet.value.trim()||"1234";save();render();saved.classList.add("show");setTimeout(()=>{saved.classList.remove("show");show("home")},900)}
function factoryReset(){if(confirm("Reset everything?")){localStorage.removeItem(KEY);state=load();render();show("home")}}
function openLink(url){window.location.href=url}
render();
</script>
</body>
</html>
