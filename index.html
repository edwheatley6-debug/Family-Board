<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Board</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #fceabb, #f8b500);
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

.tile {
    padding: 20px;
    border-radius: 20px;
    color: #000;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.blue { background: #a0d8ff; }
.green { background: #b5f2c2; }
.purple { background: #d6c2ff; }
.pink { background: #ffc2d6; }
.yellow { background: #fff3a3; }

.small {
    font-size: 14px;
    font-weight: normal;
}

button {
    padding: 10px;
    border-radius: 10px;
    border: none;
    margin: 5px;
}
</style>

<script>
let chores = [
"Make bed / open blinds / turn off lights",
"Pyjamas away",
"Brush teeth",
"School items ready",
"Tidy",
"Clothes away",
"Brush teeth",
"Water bottle"
];

function showChores(name){
    let list = chores.map(c => "<li>"+c+"</li>").join("");
    document.body.innerHTML = `
    <h1>${name} Chores</h1>
    <ul style="text-align:left; max-width:400px; margin:auto;">${list}</ul>
    <br>
    <button onclick="goHome()">⬅ Back</button>
    `;
}

function goHome(){
    location.reload();
}

function openApp(app){
    if(app === "netflix"){
        window.location.href = "intent://www.netflix.com/#Intent;scheme=https;package=com.netflix.mediaclient;end";
    }
    if(app === "music"){
        window.location.href = "intent://music.amazon.co.uk/#Intent;scheme=https;package=com.amazon.mp3;end";
    }
    if(app === "calendar"){
        window.location.href = "intent://calendar.google.com/#Intent;scheme=https;package=com.google.android.calendar;end";
    }
}
</script>

</head>

<body>

<h1>🌈 Family Board</h1>

<div class="container">

<div class="tile blue" onclick="showChores('Henry')">
👦 Henry Chores<br><span class="small">Daily jobs</span>
</div>

<div class="tile green" onclick="showChores('Arthur')">
👱 Arthur Chores<br><span class="small">Daily jobs</span>
</div>

<div class="tile purple" onclick="openApp('calendar')">
📅 Calendar<br><span class="small">Open calendar</span>
</div>

<div class="tile pink" onclick="openApp('music')">
🎵 Music<br><span class="small">Amazon Music</span>
</div>

<div class="tile yellow">
⭐ Points<br><span class="small">Pocket money</span>
</div>

<div class="tile pink" onclick="openApp('netflix')">
📺 Netflix<br><span class="small">Open Netflix</span>
</div>

</div>

</body>
</html>
