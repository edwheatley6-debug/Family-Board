<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Dashboard</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg,#9fd3ff,#f2f7ff);
  color: #222;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.title {
  font-size: 42px;
  font-weight: bold;
}

.clock {
  background: white;
  padding: 15px 25px;
  border-radius: 25px;
  font-size: 32px;
  font-weight: bold;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}

.card {
  background: white;
  border-radius: 30px;
  padding: 25px;
  margin-bottom: 25px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}

.child-buttons {
  display: flex;
  gap: 15px;
  margin-bottom: 25px;
}

.child-btn {
  border: none;
  border-radius: 18px;
  padding: 16px 28px;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
}

.active {
  background: #2563eb;
  color: white;
}

.inactive {
  background: #e5e7eb;
}

.points {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 15px;
}

.progress {
  width: 100%;
  height: 22px;
  background: #e5e7eb;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 25px;
}

.progress-bar {
