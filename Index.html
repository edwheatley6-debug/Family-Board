<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Board</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(to bottom, #fff7ed, #e0f2fe);
  margin: 0;
  padding: 20px;
}

h1 {
  font-size: 40px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.tile {
  padding: 25px;
  border-radius: 20px;
  font-size: 24px;
  font-weight: bold;
  border: none;
}

.henry { background: #93c5fd; }
.arthur { background: #86efac; }
.calendar { background: #c4b5fd; }
.music { background: #f9a8d4; }
.points { background: #fde68a; }
.netflix { background: #fca5a5; }

button {
  width: 100%;
  cursor: pointer;
}

.list {
  font-size: 22px;
}

.done {
  text-decoration: line-through;
  color: grey;
}

.home {
  margin-top: 20px;
  padding: 15px;
  font-size: 20px;
}
</style>
</head>

<body>

<div id="home">
<h1>🌈 Family Board</h1>

<div class="grid">
<button class="tile henry" onclick="show('henry')">👦 Henry Chores</button>
<button class="tile arthur" onclick="show('arthur')">👦 Arthur Chores</button>

<button class="tile calendar" onclick="openLink('https://calendar.google.com')">📅 Calendar</button>
<button class="tile music" onclick="openLink('https://music.amazon.co.uk')">🎵 Music</button>

<button class="tile points" onclick="show('points')">⭐ Points</button>
<button class="tile netflix" onclick="openLink('https://www.netflix.com')">📺 Netflix</button>
</div>
</div>

<div id="henry" style="display:none">
<h1>Henry</h1>
<div id="henryList"></div>
<button class="home" onclick="show('home')">Home</button>
</div>

<div id="arthur" style="display:none">
<h1>Arthur</h1>
<div id="arthurList"></div>
<button class="home" onclick="show('home')">Home</button>
</div>

<div id="points" style="display:none">
<h1>Points</h1>

<p>Henry: <span id="hp">0</span></p>
<button onclick="change('henry',1)">+1</button>
<button onclick="change('henry',-1)">-1</button>

<p>Arthur: <span id="ap">0</span></p>
<button onclick="change('arthur',1)">+1</button>
<button onclick="change('arthur',-1)">-1</button>

<br><br>
<button class="home" onclick="show('home')">Home</button>
</div>

<script>
let state = JSON.parse(localStorage.getItem("board")) || {
  henry: {},
  arthur: {},
  points: {henry:0, arthur:0}
};

const chores = [
"Make bed / open blinds / turn off lights",
"Pyjamas away",
"Brush teeth",
"School items ready",
"Tidy",
"Clothes away",
"Brush teeth",
"Water bottle"
];

function save(){
  localStorage.setItem("board", JSON.stringify(state));
}

function show(screen){
  document.getElementById("home").style.display="none";
  document.getElementById("henry").style.display="none";
  document.getElementById("arthur").style.display="none";
  document.getElementById("points").style.display="none";
  document.getElementById(screen).style.display="block";
}

function render(){
  let h = document.getElementById("henryList");
  let a = document.getElementById("arthurList");

  h.innerHTML="";
  a.innerHTML="";

  chores.forEach((c,i)=>{
    let box = `<div class="list">
    <input type="checkbox" onchange="toggle('henry',${i})" ${state.henry[i]?'checked':''}>
    <span class="${state.henry[i]?'done':''}">${c}</span></div>`;
    h.innerHTML += box;

    let box2 = `<div class="list">
    <input type="checkbox" onchange="toggle('arthur',${i})" ${state.arthur[i]?'checked':''}>
    <span class="${state.arthur[i]?'done':''}">${c}</span></div>`;
    a.innerHTML += box2;
  });

  document.getElementById("hp").innerText = state.points.henry;
  document.getElementById("ap").innerText = state.points.arthur;
}

function toggle(name,i){
  state[name][i] = !state[name][i];
  save();
  render();
}

function change(name,val){
  state.points[name]+=val;
  save();
  render();
}

function openLink(url){
  window.location.href = url;
}

render();
</script>

</body>
</html>
